# Force the GTK portal to use the Wayland backend only. Without this,
# GTK probes X11 (DISPLAY) at init; if Xwayland isn't up yet at session
# start the probe fails ("cannot open display: :0"), portal-gtk exits,
# xdg-desktop-portal.service times out, and waybar dies in the cascade.
[Service]
Environment=GDK_BACKEND=wayland
