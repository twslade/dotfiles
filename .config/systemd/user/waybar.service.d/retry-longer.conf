# Waybar depends on xdg-desktop-portal, which races with Xwayland startup
# on every sway login. The default RestartSec=100ms × Burst=5 burns waybar's
# entire retry budget in under a second — long before the portal recovers.
# Extend the retry window so waybar keeps trying until the portal is healthy.
[Service]
RestartSec=2
[Unit]
StartLimitBurst=30
StartLimitIntervalSec=120
