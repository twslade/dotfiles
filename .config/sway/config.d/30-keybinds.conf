# Ported keybinds from old i3 config.
# Existing distro defaults live in /etc/sway/modes/default.conf — these add on top.
# NOTE: must use `bindsym --to-code` (matching the distro's `$bindsym` alias)
# to actually OVERRIDE distro bindings. Plain `bindsym` and `bindsym --to-code`
# live in different binding tables and do not collide.
#
# The `## Category // Action // Keys ##` comments are read by
# /usr/share/sway/scripts/sbdp.py to populate the Mod+? cheat-sheet overlay.
# We pass the keybinding explicitly because sbdp.py's next-line parser reads
# token-1 of the bindsym line and would see `--to-code` instead of the key.

## Action // Region screenshot // Ctrl+Alt+Shift+P ##
bindsym --to-code Control+Mod1+Shift+p exec ~/.local/bin/sway-screenshot-area

# Vim notes scratchpad: Mod+N spawns or toggles a foot+vim window
# pinned to the sway scratchpad. Mirrors old i3 Mod+N binding.
# Drop the distro's $mod+n (= first-empty-workspace.py --switch) first,
# so sway's nag bar doesn't report an "Overwriting binding" warning.
unbindsym --to-code $mod+n
## Launch // Notes scratchpad // Mod+N ##
bindsym --to-code $mod+n exec ~/.local/bin/scratchpad-notes

# System audio (ported from old i3 bindings, on top of XF86Audio* defaults).
# Use swayosd-client so the on-screen volume overlay still appears.
## Action // Volume up // Ctrl+Shift+Up ##
bindsym --to-code Control+Shift+Up   exec $volume_up
## Action // Volume down // Ctrl+Shift+Down ##
bindsym --to-code Control+Shift+Down exec $volume_down
## Action // Mute toggle // Ctrl+Shift+M ##
bindsym --to-code Control+Shift+m    exec $volume_mute
## Action // Mic mute toggle // XF86AudioMicMute ##
bindsym --to-code XF86AudioMicMute   exec pactl set-source-mute @DEFAULT_SOURCE@ toggle

## Launch // Sound panel (pavucontrol) // Mod+Shift+A ##
bindsym --to-code $mod+Shift+a exec pavucontrol

# Spotify controls (ported from old i3 bindings).
# Old config used `dbus-send` for MPRIS; using `playerctl --player=spotify`
# for the same effect with cleaner syntax. Volume keeps the bespoke script
# that resolves Spotify's PipeWire sink-input.
## Action // Spotify volume up // Ctrl+Alt+Shift+Up ##
bindsym --to-code Control+$alt+Shift+Up    exec ~/.local/bin/spotify-volume up
## Action // Spotify volume down // Ctrl+Alt+Shift+Down ##
bindsym --to-code Control+$alt+Shift+Down  exec ~/.local/bin/spotify-volume down
## Action // Spotify play/pause // Ctrl+Alt+Shift+Space ##
bindsym --to-code Control+$alt+Shift+space exec playerctl --player=spotify play-pause
## Action // Spotify next track // Ctrl+Alt+Shift+Right ##
bindsym --to-code Control+$alt+Shift+Right exec playerctl --player=spotify next
## Action // Spotify previous track // Ctrl+Alt+Shift+Left ##
bindsym --to-code Control+$alt+Shift+Left  exec playerctl --player=spotify previous
## Action // Spotify seek forward 6s // Ctrl+Alt+Right ##
bindsym --to-code Control+$alt+Right       exec playerctl --player=spotify position 6+
## Action // Spotify seek back 6s // Ctrl+Alt+Left ##
bindsym --to-code Control+$alt+Left        exec playerctl --player=spotify position 6-
