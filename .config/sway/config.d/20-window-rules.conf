# Ported from old i3 config (assign + for_window rules).
# Sway has no `assign` directive; `for_window [...] move container to workspace`
# fires when the window first appears, which is functionally equivalent.
#
# IMPORTANT: use `number N` (not bare `N`) to match by workspace number.
# Ubuntu Sway Remix runs autoname-workspaces.py which renames workspaces to
# include app glyphs (e.g. "5:    "). Without `number`, sway would
# spawn a new literal-named "5" workspace each time.

# Comms + media on ws5 (portrait, left)
# Gmail PWA
for_window [app_id="chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Default"] move container to workspace number 5
# Outlook PWA (covers both Mail and Calendar — same app_id, different deep-link)
for_window [app_id="chrome-eoficlgicibekocmfdomjbfnjmehnhcd-Default"] move container to workspace number 5
# Audiense Slack PWA
for_window [app_id="chrome-onfakonipncbomjibdogemfdilnnkcfn-Default"] move container to workspace number 5
# Google Messages for web PWA
for_window [app_id="chrome-hpfldicfbfomlpcikngkocigghgafkph-Default"] move container to workspace number 5
for_window [class="Spotify"] move container to workspace number 6

# Zoom on ws1, floating (mirrors old i3 behavior)
for_window [class="zoom"] floating enable, move container to workspace number 1

# Notes scratchpad: a single Pluma window editing ~/Documents/notes/notes.md.
# Pluma's window title is "*notes.md (~/Documents/notes) - Pluma" — we match
# on title to scope the rule to JUST this file, leaving other pluma windows
# alone.
for_window [app_id="pluma" title=".*notes\.md.*Pluma$"] floating enable, resize set 1100 750, move scratchpad
