# Ported from old i3 config (assign + for_window rules).
# Sway has no `assign` directive; `for_window [...] move container to workspace`
# fires when the window first appears, which is functionally equivalent.
#
# IMPORTANT: use `number N` (not bare `N`) to match by workspace number.
# Ubuntu Sway Remix runs autoname-workspaces.py which renames workspaces to
# include app glyphs (e.g. "5:    "). Without `number`, sway would
# spawn a new literal-named "5" workspace each time.

# Comms + media on ws5 (portrait, left)
for_window [app_id="chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Default"] move container to workspace number 5  ;# Gmail PWA
for_window [app_id="chrome-eoficlgicibekocmfdomjbfnjmehnhcd-Default"] move container to workspace number 5  ;# Outlook PWA
for_window [app_id="chrome-onfakonipncbomjibdogemfdilnnkcfn-Default"] move container to workspace number 5  ;# Audiense Slack PWA
for_window [class="Spotify"] move container to workspace number 5

# Zoom on ws1, floating (mirrors old i3 behavior)
for_window [class="zoom"] floating enable, move container to workspace number 1

# Vim notes scratchpad (ported from old i3 setup; was window_role + xfce4-terminal).
# Foot is launched with --app-id=scratchpad-notes so this rule matches.
for_window [app_id="scratchpad-notes"] floating enable, resize set 1100 750, move scratchpad
