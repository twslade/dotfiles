# User autostart — fires once per sway session (not on reload).
#
# Spotify and the PWAs are routed by permanent for_window rules in
# 20-window-rules.conf. Chrome and Brave restore their previous windows
# (--restore-last-session), which re-opens the PWAs Chrome had open last
# session; the for_window rules then move each PWA to ws5. Obsidian is
# launched with an explicit vault URL so it doesn't reopen whichever vault
# happened to be last-used.
#
# Apps are launched sequentially in a single subshell so workspace switches
# don't race each other; brief sleeps give each window time to map before
# the next switch. End focus lands on ws1 (Chrome).

exec sh -c '\
    swaymsg "workspace number 6; move workspace to output DP-2"; \
    ~/.local/bin/spotify-custom & \
    obsidian "obsidian://open?vault=obsidian" & \
    sleep 2; \
    swaymsg "workspace number 4; move workspace to output DP-1"; \
    brave-browser --restore-last-session & \
    sleep 2; \
    swaymsg "workspace number 1; move workspace to output DP-1"; \
    google-chrome --restore-last-session & \
'
