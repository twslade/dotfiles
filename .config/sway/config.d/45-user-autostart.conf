# User autostart — fires once per sway session (not on reload).
#
# Chrome/Brave session-restore brings back browser tabs but NOT app-mode
# PWA windows, so the PWAs must be launched explicitly via gtk-launch.
# We launch them AFTER google-chrome so they attach to the already-running
# Chrome master process instead of racing it. The for_window rules in
# 20-window-rules.conf route each PWA to ws5 automatically.
#
# Obsidian gets an explicit vault URL so it doesn't reopen whichever
# vault happened to be last-used.
#
# Apps are launched sequentially in a single subshell so workspace switches
# don't race each other; brief sleeps give each window time to map before
# the next switch. End focus lands on ws1 (Chrome).

exec sh -c '\
    swaymsg "workspace number 6; move workspace to output DP-2"; \
    ~/.local/bin/spotify-custom & \
    obsidian "obsidian://open?vault=obsidian" & \
    sleep 2; \
    swaymsg "workspace number 4; move workspace to output DP-1"; \
    brave-browser --restore-last-session & \
    sleep 2; \
    swaymsg "workspace number 1; move workspace to output DP-1"; \
    google-chrome --restore-last-session & \
    sleep 3; \
    gtk-launch chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Default; \
    gtk-launch chrome-eoficlgicibekocmfdomjbfnjmehnhcd-Default; \
    gtk-launch chrome-onfakonipncbomjibdogemfdilnnkcfn-Default; \
'
