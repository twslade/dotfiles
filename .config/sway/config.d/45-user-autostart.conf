# User autostart — DISABLED.
#
# This used to launch Spotify/Obsidian/Brave/Chrome/PWAs and pin each
# workspace to its monitor at sway start. It raced against nwg-displays,
# autoname-workspaces, and autotiling: workspaces landed on the wrong
# outputs, and on at least one boot a workspace ended up named literally
# "number 1" instead of "1".
#
# Replaced by ~/.local/bin/sway-restore-session — a manual script the user
# runs after each fresh login. The script focuses each output explicitly
# before creating the workspaces that belong there, so workspace placement
# is deterministic rather than driven by `workspace number N output X`
# directives racing config-load order.
