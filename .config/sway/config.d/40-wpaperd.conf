# wpaperd: rotating wallpapers (Variety replacement). Reads
# ~/.config/wpaperd/config.toml and rotates per-output every 30 min.
# Absolute path because sway's PATH (inherited from greetd) doesn't include
# ~/.cargo/bin.
#
# `exec_always` + pgrep guard: re-fires on `swaymsg reload`, but the guard
# stops a duplicate daemon from starting if one is already running.
exec_always pgrep -x wpaperd >/dev/null || /home/thomas/.cargo/bin/wpaperd -d

# Wallpaper-control submode (ported from old i3 $mode_wallpaper).
# Pango markup so the mode name itself carries the key hints — same pattern
# the distro uses for $mode_resize / $mode_screenshot / $mode_recording.
set $mode_wallpaper "<span foreground='$color5'><b>Wallpaper</b></span>  <span foreground='$color10'>(<b>n</b>)</span>ext  <span foreground='$color10'>(<b>p</b>)</span>revious"

mode --pango_markup $mode_wallpaper {
    bindsym --to-code n exec /home/thomas/.cargo/bin/wpaperctl next,     mode "default"
    bindsym --to-code p exec /home/thomas/.cargo/bin/wpaperctl previous, mode "default"

    bindsym --to-code Return mode "default"
    bindsym --to-code Escape mode "default"
}

# Distro binds $mod+b to `splith`. Drop that and re-bind to the mode entry.
unbindsym --to-code $mod+b
## Action // Wallpaper mode (n/p to cycle) // Mod+B ##
bindsym --to-code $mod+b mode $mode_wallpaper
