# Override the distro $help variable to use our overlay-layer version.
# Default /usr/share/sway/scripts/help.sh launches nwg-wrapper without -l 3,
# so the cheatsheet sits BELOW other windows. Our version uses overlay.
set $help ~/.local/bin/sway-help-toggle --toggle

# Override $help_menu (the autostart that spawns the cheatsheet at boot) to
# use our script instead of the distro's. Ours passes -i so the overlay
# starts hidden — distro's spawns it visible, giving the "welcome to sway"
# banner on every login. $help_menu is defined in /etc/sway/variables and
# exec'd from /etc/sway/config.d/40-autostart-applications.conf.
set $help_menu ~/.local/bin/sway-help-toggle

# Ensure the nwg-wrapper help overlay is running so $mod+? can toggle it.
# Distro spawns it once via `exec` at boot; if the process dies (or doesn't
# start because exec was set up before our overlay-layer override was added),
# we re-spawn on reload. Guard avoids duplicate spawns.
exec_always pgrep -f 'nwg-wrapper.*help.sh' >/dev/null || ~/.local/bin/sway-help-toggle

# Exclude ws5 from autotiling so its tabbed layout (comms apps) stays put.
# Distro default is `autotiling -w 1 3 5 7 9`; we drop the 5 here.
# Single quotes match distro syntax — `[ -x …` would otherwise be parsed as a
# sway criteria selector.
set $autotiling '[ -x "$(command -v autotiling)" ] && autotiling -w 1 3 7 9'

# Distro autostarts $autotiling via `exec` (one-shot at sway start). We
# need an `exec_always` guard so reload also keeps it alive after our edits
# kill the previous instance.
exec_always pgrep -f 'autotiling -w' >/dev/null || autotiling -w 1 3 7 9

# wofi launcher: greetd-launched sway doesn't propagate XDG_DATA_HOME /
# XDG_DATA_DIRS, and wofi doesn't fall back to the XDG-spec defaults,
# so ~/.local/share/applications (where Chrome PWAs live) is ignored.
# Wrap the launcher with explicit env so PWAs show up in drun mode.
set $menu env XDG_DATA_HOME=$HOME/.local/share XDG_DATA_DIRS=/usr/local/share:/usr/share wofi --term $term

# Old i3 alias for Alt — used by Spotify control bindings.
set $alt Mod1

# Audio: bypass swayosd. The distro defines these to call swayosd-client,
# but swayosd's DBus service file is missing on this system (server runs
# but is unreachable), so every audio binding silently no-ops. Use pactl
# directly until/unless swayosd gets fixed.
set $volume_up   pactl set-sink-volume @DEFAULT_SINK@ +5%
set $volume_down pactl set-sink-volume @DEFAULT_SINK@ -5%
set $volume_mute pactl set-sink-mute @DEFAULT_SINK@ toggle
