## picom — migrated from ~/.config/compton/compton.conf, deprecated options
## removed (dbe, glx-copy-from-front, mark-wmwin-focused, mark-ovredir-focused,
## use-ewmh-active-win, refresh-rate). Backend kept as xrender to preserve the
## same look-and-feel; switch to "glx" later if you want compositor-level vsync
## and lower CPU.

backend = "xrender";
vsync = false;

# --- Shadows ---
shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = 0;
shadow-opacity = 0.8;
shadow-red = 0.11;
shadow-green = 0.12;
shadow-blue = 0.13;
shadow-exclude = [
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'i3-frame'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_STICKY'",
  "!I3_FLOATING_WINDOW@:c"
];
shadow-ignore-shaped = true;

# --- Blur (off by default; left here for reference) ---
blur-background = false;
blur-background-fixed = true;
blur-kern = "7x7box";
blur-background-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Opacity rules ---
# Sticky windows always semi-transparent so floating helpers don't dominate.
opacity-rule = [
  "97:class_g = 'Termite' && !_NET_WM_STATE@:32a",
  "90:_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_STICKY'",
  "90:_NET_WM_STATE@[1]:32a = '_NET_WM_STATE_STICKY'",
  "90:_NET_WM_STATE@[2]:32a = '_NET_WM_STATE_STICKY'",
  "90:_NET_WM_STATE@[3]:32a = '_NET_WM_STATE_STICKY'",
  "90:_NET_WM_STATE@[4]:32a = '_NET_WM_STATE_STICKY'"
];

# --- Fading ---
fading = true;
fade-delta = 7;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-exclude = [];

# --- Misc ---
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = false;
focus-exclude = [];
detect-transient = true;
detect-client-leader = true;
invert-color-include = [];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.00; focus = true; };
  dock    = { shadow = false; };
  dnd     = { shadow = false; };
};
