; Redshift config — manual location bypasses GeoClue (which requires
; agent authorization not present in pure-i3 sessions).
; Charleston, SC.

[redshift]
temp-day=6500
temp-night=3700
fade=1
gamma=1.0
location-provider=manual
adjustment-method=randr

[manual]
lat=32.78
lon=-79.93

[randr]
screen=0
